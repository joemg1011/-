<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot Runner</title>
  <style>
    :root{--ink:#f7f5ff;--violet:#513eff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#30246d,#0d0920 62%);color:var(--ink);font-family:Arial,'Malgun Gothic',sans-serif}button{font:inherit;cursor:pointer}.shell{min-height:100vh;display:grid;place-items:center;padding:22px}.game{width:min(98vw,1120px);text-align:center}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;margin-bottom:16px}.score div{display:grid;gap:3px;text-align:left}.score div:last-child{text-align:right}.score small{font-size:.72rem;color:#beb8e7;letter-spacing:.12em}.score strong{font-size:1.1rem;letter-spacing:.08em}.score h1{margin:0;color:#ffd93d;font-size:clamp(1rem,3vw,1.5rem);letter-spacing:.16em}.lives strong{color:#ffd93d;letter-spacing:.12em}.board{position:relative;display:grid;grid-template-columns:repeat(39,minmax(0,1fr));grid-template-rows:repeat(27,minmax(0,1fr));width:100%;aspect-ratio:39/27;overflow:hidden;border:5px solid #6658ff;background:#05030d;box-shadow:0 0 0 4px #25205b,0 20px 50px #0008}.tile{display:grid;place-items:center;overflow:hidden}.wall{border:1px solid #7569ff;border-radius:17%;background:var(--violet)}.pellet{width:21%;aspect-ratio:1;border-radius:50%;background:#fff8dc}.power{width:56%;aspect-ratio:1;border-radius:50%;background:#fff8dc;box-shadow:0 0 12px 4px #fff6ab;animation:pulse .75s infinite alternate}.actor{position:absolute;display:grid;width:calc(100%/39);height:calc(100%/27);place-items:center;pointer-events:none}.pac-actor{z-index:2;transition:left 160ms linear,top 160ms linear}.ghost-actor{z-index:3;transition:left 495ms linear,top 495ms linear}.pac{width:92%;aspect-ratio:1;border-radius:50%;background:#ffd93d;clip-path:polygon(0 0,100% 50%,0 100%,20% 50%)}.pac.down{transform:rotate(90deg)}.pac.left{transform:rotate(180deg)}.pac.up{transform:rotate(-90deg)}.ghost{display:flex;width:91%;height:91%;align-items:center;justify-content:space-evenly;padding-top:18%;border-radius:50% 50% 12% 12%;background:var(--color)}.ghost i{width:24%;aspect-ratio:1;border-radius:50%;background:#fff}.ghost i:after{content:'';display:block;width:43%;aspect-ratio:1;margin:35% 0 0 42%;border-radius:50%;background:#11152d}.frightened{--color:#2156f3!important;box-shadow:0 0 10px 3px #3d8bff}.blink{animation:blink .35s steps(2,end) infinite}.cue,.power-status,.overlay{position:absolute;z-index:5}.cue{left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(1.3rem,5vw,3.2rem);font-weight:900;letter-spacing:.1em;text-shadow:0 3px 12px #000}.ready{color:#ffd93d}.death{color:#ff9fb0}.power-status{right:2.2%;top:2.4%;border:1px solid #94baff;border-radius:999px;background:#123baf;padding:.28rem .65rem;font-size:clamp(.58rem,1.5vw,.88rem);font-weight:900;letter-spacing:.09em}.overlay{inset:0;display:grid;place-content:center;gap:16px;background:#070415d9;font-size:clamp(1.4rem,5vw,2.3rem)}.overlay button,.pause,.restart{border:0;border-radius:999px;padding:.65rem 1.1rem;background:#ffd93d;color:#171019;font-weight:800}.help{margin:16px auto 12px;color:#cec9eb;font-size:.88rem}.controls{display:grid;grid-template:". up ." 42px "left down right" 42px/repeat(3,48px);justify-content:center;gap:6px}.controls button{border:1px solid #776bcd;border-radius:10px;background:#241c53;color:#fff}.up{grid-area:up}.left{grid-area:left}.down{grid-area:down}.right{grid-area:right}.actions{display:flex;justify-content:center;gap:9px;margin-top:15px}.restart{border:1px solid #776bcd;background:transparent;color:#e6e2ff;font-size:.85rem}.shake{animation:shake .34s linear infinite}.dying{animation:fade 1.1s ease-in-out}@keyframes pulse{to{opacity:.3;transform:scale(.7)}}@keyframes blink{50%{background:#f5f5f5}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes fade{45%{transform:scale(1.45) rotate(160deg);opacity:1}100%{transform:scale(0);opacity:0}}@media(max-width:600px){.shell{padding:10px}.board{border-width:3px}.help{font-size:.76rem}}
  </style>
</head>
<body>
  <main class="shell"><section class="game"><header class="score"><div><small>점수</small><strong id="score">00000</strong></div><h1>DOT RUNNER</h1><div class="lives"><small>목숨</small><strong id="lives">●●●</strong></div></header><div id="board" class="board" aria-label="팩맨 스타일 미로 게임"></div><p class="help">방향키 또는 십자 버튼으로 이동하세요. 스페이스바나 일시정지 버튼으로 멈출 수 있습니다.</p><div class="controls"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><div class="actions"><button id="pause" class="pause">일시정지</button><button id="restart" class="restart">처음부터</button></div></section></main>
  <script>
    const R=27,C=39,TICK=165,DIR={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]},OP={up:'down',down:'up',left:'right',right:'left'};
    const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),pauseBtn=document.querySelector('#pause');
    const id=p=>p.r+':'+p.c,eq=(a,b)=>a.r===b.r&&a.c===b.c,dist=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c);
    function maze(){const g=Array.from({length:R},(_,r)=>Array.from({length:C},(_,c)=>r===0||c===0||r===R-1||c===C-1?'#':'.'));const blocks=[[2,3,2,7],[2,15,2,9],[2,29,2,7],[6,2,3,4],[6,9,2,6],[6,18,2,3],[6,24,2,6],[6,33,3,4],[10,4,2,7],[10,13,2,4],[10,22,2,4],[10,28,2,7],[15,2,3,4],[15,9,2,6],[15,24,2,6],[15,33,3,4],[20,3,2,7],[20,15,2,9],[20,29,2,7],[23,10,1,5],[23,24,1,5]];for(const[r,c,h,w]of blocks)for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)g[y][x]='#';for(let r=12;r<=14;r++)for(let c=15;c<=23;c++)g[r][c]=' ';g[13][0]=g[13][C-1]='.';[[1,1],[1,C-2],[R-2,1],[R-2,C-2]].forEach(([r,c])=>g[r][c]='o');return g.map(x=>x.join(''))}const MAP=maze();
    const cell=p=>MAP[p.r]?.[p.c],walk=p=>['.','o',' '].includes(cell(p)||'#');function step(p,d){if(p.r===13&&p.c===0&&d==='left')return{r:13,c:C-1};if(p.r===13&&p.c===C-1&&d==='right')return{r:13,c:0};return{r:p.r+DIR[d][0],c:p.c+DIR[d][1]}}const can=(p,d)=>walk(step(p,d));
    function starts(){return[{id:0,name:'BLINKY',r:13,c:17,color:'#ff4d6d',dir:'left',release:12},{id:1,name:'PINKY',r:13,c:18,color:'#f9a8d4',dir:'right',release:30},{id:2,name:'INKY',r:13,c:20,color:'#67e8f9',dir:'left',release:50},{id:3,name:'CLYDE',r:13,c:21,color:'#fb923c',dir:'right',release:70}]}function dots(){return new Set(MAP.flatMap((row,r)=>[...row].flatMap((x,c)=>x==='.'||x==='o'?[id({r,c})]:[])))}
    let g,queued='left';function fresh(){return{player:{r:24,c:19},dir:'left',ghosts:starts(),pellets:dots(),score:0,lives:3,power:0,chain:0,phase:'ready',phaseFrames:6,frame:0,paused:false}}function resetRound(){Object.assign(g,{player:{r:24,c:19},dir:'left',ghosts:starts(),power:0,chain:0,phase:'ready',phaseFrames:6,frame:0,paused:false})}
    function target(gh){if(gh.id===0)return g.player;const ahead=n=>({r:g.player.r+DIR[g.dir][0]*n,c:g.player.c+DIR[g.dir][1]*n});if(gh.id===1)return ahead(4);if(gh.id===2){const p=ahead(2),red=g.ghosts[0];return{r:p.r*2-red.r,c:p.c*2-red.c}}return dist(gh,g.player)>8?g.player:{r:R-2,c:1}}
    function ghostMove(gh,occupied){const legal=Object.keys(DIR).filter(d=>can(gh,d)),forward=legal.filter(d=>d!==OP[gh.dir]),choices=forward.length?forward:legal;const flee=g.power>0;const pick=choices.map(d=>({d,p:step(gh,d)})).filter(x=>!occupied.has(id(x.p))).sort((a,b)=>flee?dist(b.p,g.player)-dist(a.p,g.player):dist(a.p,target(gh))-dist(b.p,target(gh)))[0];return pick?{...gh,...pick.p,dir:pick.d}:gh}
    function collide(list){const hits=list.filter(x=>eq(x,g.player));if(!hits.length)return false;if(g.power){const eaten=new Set(hits.map(x=>x.id)),home=starts();g.ghosts=g.ghosts.map(x=>{if(!eaten.has(x.id))return x;g.score+=[200,400,800,1600][Math.min(g.chain++,3)];return home[x.id]});return false}g.lives--;g.phase='dying';g.phaseFrames=7;return true}
    function phase(){if(g.phase==='ready'){if(g.phaseFrames--<=0)g.phase='playing'}else if(g.phase==='dying'){if(g.phaseFrames--<=0){if(g.lives<=0)g.phase='lost';else resetRound()}}}
    function tick(){if(g.paused)return render();if(g.phase!=='playing'){phase();return render()}const d=can(g.player,queued)?queued:g.dir;g.dir=d;if(can(g.player,d))g.player=step(g.player,d);g.frame++;g.power=Math.max(0,g.power-1);const k=id(g.player);if(g.pellets.delete(k)){const power=cell(g.player)==='o';g.score+=power?50:10;if(power){g.power=54;g.chain=0;g.ghosts=g.ghosts.map(x=>({...x,dir:OP[x.dir]}))}}if(!g.pellets.size)g.phase='won';if(collide(g.ghosts))return render();if(g.frame%3===0){const used=new Set();g.ghosts=g.ghosts.map(x=>{if(g.frame<x.release){used.add(id(x));return x}const n=ghostMove(x,used);used.add(id(n));return n});collide(g.ghosts)}render()}
    function actor(cls,p,html){return `<div class="actor ${cls}" style="left:calc(${p.c} * 100% / 39);top:calc(${p.r} * 100% / 27)">${html}</div>`}function render(){let cells='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){const x=MAP[r][c],dot=g.pellets.has(r+':'+c);cells+=`<div class="tile ${x==='#'?'wall':''}">${dot?`<i class="${x==='o'?'power':'pellet'}"></i>`:''}</div>`}let actors=actor('pac-actor',g.player,`<i class="pac ${g.dir} ${g.phase==='dying'?'dying':''}"></i>`);for(const gh of g.ghosts)actors+=actor('ghost-actor',gh,`<i class="ghost ${g.power?'frightened '+(g.power<14?'blink':''):''}" style="--color:${g.power?'#2156f3':gh.color}"><i></i><i></i></i>`);let over=g.phase==='won'||g.phase==='lost'?`<div class="overlay"><strong>${g.phase==='won'?'미로 완료!':'게임 오버'}</strong><button onclick="restart()">다시 하기</button></div>`:'';board.className='board '+(g.phase==='dying'?'shake':'');board.innerHTML=cells+actors+(g.phase==='ready'?'<div class="cue ready">READY!</div>':'')+(g.phase==='dying'?'<div class="cue death">잡혔다!</div>':'')+(g.power?'<div class="power-status">POWER MODE</div>':'')+(g.paused?'<div class="overlay"><strong>일시정지</strong><button onclick="togglePause()">계속하기</button></div>':'')+over;scoreEl.textContent=String(g.score).padStart(5,'0');livesEl.textContent='●'.repeat(Math.max(0,g.lives))+'○'.repeat(3-Math.max(0,g.lives));pauseBtn.textContent=g.paused?'계속하기':'일시정지'}
    function togglePause(){if(g.phase==='playing'){g.paused=!g.paused;render()}}function restart(){g=fresh();queued='left';render()}window.togglePause=togglePause;window.restart=restart;document.addEventListener('keydown',e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(m[e.key]){e.preventDefault();queued=m[e.key]}if(e.code==='Space'){e.preventDefault();togglePause()}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',()=>queued=b.dataset.dir));pauseBtn.onclick=togglePause;document.querySelector('#restart').onclick=restart;restart();setInterval(tick,TICK);
  </script>
</body>
</html>
