<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>바람이 머무는 오후</title>
  <style>
    :root{--ink:#3e3540;--paper:#f8efd9;--coral:#d76f61}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8d5b5;color:var(--ink);font-family:Georgia,'Malgun Gothic',serif}body{overflow:hidden}.art{position:relative;width:100vw;height:100vh;min-height:560px;background:#e8d5b5}.art:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.2;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");mix-blend-mode:multiply}.scene{display:block;width:100%;height:100%;cursor:none}.intro{position:absolute;z-index:2;left:clamp(22px,6vw,92px);top:clamp(24px,7vh,70px);pointer-events:none}.eyebrow{margin:0 0 10px;color:#8e625c;font:700 11px/1.2 Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase}.intro h1{max-width:480px;margin:0;color:#514451;font-size:clamp(2rem,5vw,4.6rem);font-weight:400;line-height:.96;letter-spacing:-.04em}.intro p{margin:18px 0 0;color:#725d5d;font-size:clamp(.84rem,1.3vw,1rem);line-height:1.6}.hint{position:absolute;z-index:2;right:clamp(20px,5vw,72px);bottom:28px;margin:0;color:#765f60;font:11px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;pointer-events:none}.wind{position:absolute;z-index:2;right:clamp(20px,5vw,72px);top:28px;display:flex;align-items:center;gap:10px;color:#765f60;font:11px Arial,sans-serif;letter-spacing:.1em}.wind i{display:block;width:34px;height:1px;background:#b8847e;transform-origin:left;transition:transform .2s ease}.wind b{font-weight:400}.back{position:absolute;z-index:3;right:20px;top:64px;border:1px solid #b7857a;border-radius:2px;padding:8px 11px;background:#f8efd988;color:#765f60;font:11px Arial,sans-serif;letter-spacing:.08em;text-decoration:none}.back:hover{background:#f8efd9}.note{position:absolute;inset:auto 50% 8%;z-index:2;width:max-content;transform:translateX(-50%);color:#765f60;font-size:clamp(.7rem,1vw,.82rem);font-style:italic;opacity:.9}
    @media(max-width:650px){.intro h1{max-width:260px}.intro p{max-width:230px}.hint{bottom:18px}.wind{top:auto;bottom:50px;right:20px}.note{display:none}.back{top:20px;right:18px}}
  </style>
</head>
<body>
  <main class="art">
    <canvas id="scene" class="scene" aria-label="마우스로 바람을 움직이는 벚꽃나무 아래 소녀 미디어 아트"></canvas>
    <div class="intro"><p class="eyebrow">A wind study · 01</p><h1>바람이 머무는<br>오후</h1><p>커서를 움직여 봄의 방향을<br>조용히 바꿔보세요.</p></div>
    <div class="wind"><i id="windLine"></i><b id="windReadout">남풍 02</b></div>
    <p class="note">the day carries what we cannot hold</p>
    <p class="hint">move your cursor · guide the breeze</p>
    <a class="back" href="index.html">DOT RUNNER</a>
  </main>
  <script>
    const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),windLine=document.querySelector('#windLine'),windReadout=document.querySelector('#windReadout');
    const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    let W=0,H=0,dpr=1,time=0,mouse={x:.72,y:.48,px:.72,py:.48},petals=[],grass=[];
    const palette={sky:'#dce3d4',sky2:'#d2d9ca',hill:'#b3c7af',hill2:'#8eaa91',ground:'#b6a17f',ink:'#514451',trunk:'#665049',branch:'#73534e',pink:'#d995a5',pink2:'#e9b4bb',cream:'#f9e8d2',dress:'#78969a',dressDark:'#4f747a',hair:'#493d48'};
    function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);grass=Array.from({length:Math.ceil(W/8)},(_,i)=>({x:i*8+rand(-3,3),h:rand(12,35),lean:rand(-7,7)}));}
    function stroke(points,color,width,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();}
    function pencilLine(points,color,width,alpha=1){stroke(points,color,width,alpha);stroke(points,color,Math.max(.45,width*.28),alpha*.45);}
    function flower(x,y,s,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);for(let i=0;i<5;i++){ctx.rotate(TAU/5);ctx.fillStyle=i%2?'#dfa0ad':palette.pink2;ctx.beginPath();ctx.ellipse(0,-s*.55,s*.34,s*.62,0,0,TAU);ctx.fill();pencilLine([[0,-s*.2],[0,-s*.72]],'#b87988',Math.max(1,s*.07),.45)}ctx.fillStyle='#d28775';ctx.beginPath();ctx.arc(0,0,s*.16,0,TAU);ctx.fill();ctx.restore();}
    function makePetal(){return{x:rand(-40,W+40),y:rand(-30,H),size:rand(3,8),phase:rand(0,TAU),speed:rand(.35,1.1),rot:rand(0,TAU),spin:rand(-.04,.04),tone:Math.random()<.55?palette.pink:palette.pink2};}
    function reset(){petals=Array.from({length:Math.round(clamp(W/7,70,180))},makePetal);}
    function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,palette.sky);g.addColorStop(.63,palette.sky2);g.addColorStop(1,'#c8b38f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.2;ctx.fillStyle='#fff8e8';for(let i=0;i<14;i++){ctx.beginPath();ctx.ellipse((i*173+80)%W,100+(i%4)*62,90,20,0,0,TAU);ctx.fill()}ctx.globalAlpha=1;}
    function drawHills(){ctx.fillStyle=palette.hill;ctx.beginPath();ctx.moveTo(0,H*.55);ctx.quadraticCurveTo(W*.22,H*.38,W*.43,H*.56);ctx.quadraticCurveTo(W*.68,H*.34,W,H*.54);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle=palette.hill2;ctx.globalAlpha=.48;ctx.beginPath();ctx.moveTo(0,H*.68);ctx.quadraticCurveTo(W*.3,H*.45,W*.58,H*.66);ctx.quadraticCurveTo(W*.78,H*.5,W,H*.66);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.globalAlpha=1;}
    function drawGround(){ctx.fillStyle=palette.ground;ctx.beginPath();ctx.moveTo(0,H*.7);ctx.quadraticCurveTo(W*.24,H*.63,W*.5,H*.72);ctx.quadraticCurveTo(W*.76,H*.61,W,H*.7);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();grass.forEach(g=>pencilLine([[g.x,H-2],[g.x+g.lean,H-g.h]],'#657d68',1.2,.52));}
    function drawTree(){const rootX=W*.48,rootY=H*.77,windX=(mouse.x-.5)*34;ctx.save();ctx.translate(rootX,rootY);const sway=windX*.16;pencilLine([[0,0],[-12,-H*.18],[-8,-H*.43],[sway-28,-H*.66],[sway-90,-H*.79]],palette.trunk,18,.95);pencilLine([[0,-H*.05],[48,-H*.25],[84,-H*.48],[sway+142,-H*.71]],palette.branch,12,.9);pencilLine([[-8,-H*.3],[-90,-H*.5],[-160+windX,-H*.71],[-220+windX,-H*.76]],palette.branch,10,.9);pencilLine([[22,-H*.46],[68,-H*.65],[110+windX,-H*.8]],palette.branch,7,.9);pencilLine([[-75,-H*.5],[-60,-H*.72],[-80+windX,-H*.88]],palette.branch,6,.8);ctx.restore();const clusters=[[-W*.08,H*.12,1.18],[W*.08,H*.05,1.05],[W*.27,H*.16,.88],[W*.47,H*.07,1.1],[W*.68,H*.13,1],[W*.89,H*.08,1.08],[W*1.02,H*.25,.86]];clusters.forEach(([x,y,s],i)=>{for(let n=0;n<14;n++){const a=n*2.4+i,x2=x+Math.cos(a)*85*s+rand(-30,30),y2=y+Math.sin(a*1.3)*47*s+rand(-18,18);flower(x2,y2,rand(8,17)*s,a)}});}
    function drawGirl(){const x=W*.53,y=H*.75,blow=(mouse.x-.5)*18,flutter=Math.sin(time*.09)*2+blow*.25;ctx.save();ctx.translate(x,y);pencilLine([[0,-3],[-4,-42],[-7,-80]],palette.dressDark,2,.55);ctx.fillStyle=palette.dress;ctx.beginPath();ctx.moveTo(-7,-82);ctx.quadraticCurveTo(-18,-112,-4,-148);ctx.quadraticCurveTo(5,-160,15,-146);ctx.quadraticCurveTo(28,-110,43,-14);ctx.quadraticCurveTo(20,-2,0,0);ctx.quadraticCurveTo(-17,-12,-7,-82);ctx.fill();pencilLine([[-2,-78],[10,-113],[25,-145]],'#a6c0bd',2,.7);pencilLine([[14,-24],[26+flutter,-8],[52+blow,-16]],palette.dressDark,3,.8);pencilLine([[1,-18],[-13+flutter,4],[-29+blow,-4]],palette.dressDark,3,.8);ctx.fillStyle=palette.cream;ctx.beginPath();ctx.arc(4,-160,18,0,TAU);ctx.fill();ctx.fillStyle=palette.hair;ctx.beginPath();ctx.moveTo(-14,-162);ctx.quadraticCurveTo(-22,-194,5,-199);ctx.quadraticCurveTo(28,-198,24,-165);ctx.quadraticCurveTo(45+blow,-135,26+blow,-115);ctx.quadraticCurveTo(12,-137,15,-169);ctx.quadraticCurveTo(5,-150,-14,-162);ctx.fill();pencilLine([[16,-182],[40+blow,-164],[51+blow,-133]],palette.hair,4,.9);pencilLine([[12,-176],[31+blow,-151],[44+blow,-126]],palette.hair,3,.65);pencilLine([[-11,-185],[-22+blow,-160],[-11+blow,-137]],palette.hair,3,.7);pencilLine([[5,-140],[4,-151]],'#b77578',1,.65);ctx.restore();}
    function drawPetals(){const fx=(mouse.x-.5)*1.8,fy=(mouse.y-.5)*.5;petals.forEach(p=>{p.x+=fx*p.speed+p.speed*.35;p.y+=fy*p.speed+Math.sin(time*.035+p.phase)*.45;p.rot+=p.spin+fx*.002;if(p.x>W+45)p.x=-45;if(p.x<-45)p.x=W+45;if(p.y>H+30)p.y=-30;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.tone;ctx.globalAlpha=.82;ctx.beginPath();ctx.moveTo(-p.size,0);ctx.quadraticCurveTo(0,-p.size*.8,p.size,0);ctx.quadraticCurveTo(0,p.size*.8,-p.size,0);ctx.fill();pencilLine([[-p.size*.7,0],[p.size*.7,0]],'#b87988',.6,.6);ctx.restore()});}
    function draw(){time++;drawSky();drawHills();drawGround();drawTree();drawGirl();drawPetals();const dx=mouse.x-mouse.px,dy=mouse.y-mouse.py;mouse.px+=(mouse.x-mouse.px)*.04;mouse.py+=(mouse.y-mouse.py)*.04;requestAnimationFrame(draw);}
    function pointer(e){mouse.x=clamp(e.clientX/W,0,1);mouse.y=clamp(e.clientY/H,0,1);const angle=Math.atan2(mouse.y-.5,mouse.x-.5)*180/Math.PI;const names=['동풍','남동풍','남풍','남서풍','서풍','북서풍','북풍','북동풍'];const index=Math.round((angle+90)/45+8)%8;windReadout.textContent=names[index]+' '+String(Math.round(Math.hypot(mouse.x-.5,mouse.y-.5)*9)).padStart(2,'0');windLine.style.transform=`rotate(${angle}deg) scaleX(${.65+Math.hypot(mouse.x-.5,mouse.y-.5)*1.8})`;}
    addEventListener('resize',()=>{resize();reset()});addEventListener('pointermove',pointer);resize();reset();pointer({clientX:W*.72,clientY:H*.48});draw();
  </script>
</body>
</html>
